<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Record System</h1>
        </header>

        <div class="main-content">
            <div class="form-section">
                <h2>Add/Edit Student</h2>
                <form id="studentForm">
                    <div class="form-group">
                        <input type="text" id="rollNumber" placeholder="Roll Number" required>
                        <input type="text" id="name" placeholder="Student Name" required>
                        <input type="text" id="photo" placeholder="Photo URL" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="email" placeholder="Email" required>
                        <input type="tel" id="mobile" placeholder="Mobile Number" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="fatherName" placeholder="Father's Name" required>
                        <input type="text" id="motherName" placeholder="Mother's Name" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="branch" placeholder="Branch" required>
                        <input type="text" id="department" placeholder="Department" required>
                    </div>
                    <div class="form-group">
                        <input type="number" id="semester" placeholder="Semester" required>
                        <input type="text" id="hostelRoom" placeholder="Hostel Room Number" required>
                    </div>
                    <div class="form-group">
                        <input type="number" id="feePending" placeholder="Fee Pending" required>
                    </div>
                    <button type="submit" id="submitBtn">Add Student</button>
                </form>
            </div>

            <div class="search-section">
                <input type="text" id="searchInput" placeholder="Search students...">
            </div>

            <div class="table-section">
                <table id="studentTable">
                    <thead>
                        <tr>
                            <th>Photo</th>
                            <th>Roll No.</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Mobile</th>
                            <th>Father's Name</th></th>
                            <th>Mother's Name</th>
                            <th>Branch</th>
                            <th>Department</th>
                            <th>Semester</th>
                            <th>Hostel Room</th>
                            <th>Fee Pending</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody"></tbody>
                </table
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
